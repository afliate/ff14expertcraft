<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고난도 제작 계산기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #131920;
  --surface: #0f1a24;
  --surface2: #131e2a;
  --surface3: #1a2535;
  --border: #1c2d3e;
  --border2: #243344;
  --accent: #3ecfaa;
  --accent-dim: #1e8a72;
  --accent-glow: rgba(62,207,170,.12);
  --sky: #5ab8d4;
  --sky-dim: #2a7090;
  --sky-glow: rgba(90,184,212,.10);
  --text: #c8dce8;
  --text-dim: #7a96a8;
  --text-bright: #eef6ff;
  --red: #e05060;
  --red-dim: rgba(224,80,96,.12);
  --green: #4dc890;
  --green-dim: rgba(77,200,144,.12);
  --yellow: #c8b840;
  --yellow-dim: rgba(200,184,64,.10);
  --purple: #a06ccc;
  --purple-dim: rgba(160,108,204,.12);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);color:var(--text);
  font-family:'Noto Sans KR',sans-serif;font-size:14px;line-height:1.7;
  min-height:100vh; padding:32px;
}

/* ── TAB SWITCHER ── */
.calc-tabs{display:flex;gap:0;margin-bottom:28px;border:1px solid var(--border);border-radius:4px;overflow:hidden;width:fit-content;}
.calc-tab{
  padding:9px 24px;background:none;border:none;
  font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:700;
  color:var(--text-dim);cursor:pointer;letter-spacing:.06em;
  transition:color .15s,background .15s;white-space:nowrap;
}
.calc-tab + .calc-tab{border-left:1px solid var(--border);}
.calc-tab.active{color:var(--accent);background:var(--accent-glow);}
.calc-tab:hover:not(.active){color:var(--text);background:rgba(255,255,255,.03);}

.calc-panel{display:none;}
.calc-panel.active{display:block;}

/* ── LAYOUT ── */
.calc-body{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:start;}

/* ── INPUT PANEL ── */
.input-panel{
  background:var(--surface);border:1px solid var(--border);border-radius:4px;
  padding:18px;display:flex;flex-direction:column;gap:16px;
}
.input-section-label{
  font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--text-dim);margin-bottom:8px;
  display:flex;align-items:center;gap:8px;
}
.input-section-label::after{content:'';flex:1;height:1px;background:var(--border);}

.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:11px;color:var(--text-dim);font-weight:500;}
.field input[type="number"], .field select{
  width:100%;padding:7px 10px;
  background:var(--surface2);border:1px solid var(--border);border-radius:3px;
  color:var(--text-bright);font-family:'Noto Sans KR',sans-serif;font-size:13px;
  transition:border-color .15s;outline:none;
}
.field input[type="number"]:focus, .field select:focus{border-color:var(--accent-dim);}
.field input[type="number"].filled{border-color:var(--accent-dim);background:rgba(62,207,170,.04);}
.field select option{background:#1a2535;}
.field .hint{font-size:10px;color:var(--text-dim);}

/* 모드 토글 */
.mode-toggle{display:flex;gap:0;border:1px solid var(--border);border-radius:3px;overflow:hidden;}
.mode-btn{
  flex:1;padding:7px 10px;background:none;border:none;
  font-family:'Noto Sans KR',sans-serif;font-size:11px;font-weight:700;
  color:var(--text-dim);cursor:pointer;letter-spacing:.04em;
  transition:color .15s,background .15s;
}
.mode-btn + .mode-btn{border-left:1px solid var(--border);}
.mode-btn.active{color:var(--accent);background:var(--accent-glow);}

/* 레시피 셀렉터 계층 */
.recipe-chain{display:flex;flex-direction:column;gap:8px;}
.chain-arrow{
  font-size:10px;color:var(--text-dim);text-align:center;
  display:flex;align-items:center;gap:6px;padding:0 4px;
}
.chain-arrow::before,.chain-arrow::after{content:'';flex:1;height:1px;background:var(--border);}

/* 커스텀 모드 박스 */
.custom-box{
  background:var(--surface2);border:1px solid var(--border2);border-radius:3px;
  padding:12px;display:flex;flex-direction:column;gap:10px;
}

/* ── RESULT PANEL ── */
.result-panel{display:flex;flex-direction:column;gap:14px;}

/* 레시피 정보 카드 */
.recipe-info-card{
  background:var(--surface);border:1px solid var(--border);border-radius:4px;
  padding:14px 18px;
}
.recipe-info-header{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;}
.recipe-name{font-size:15px;font-weight:700;color:var(--text-bright);}
.recipe-badge{
  font-size:9px;font-weight:900;letter-spacing:.08em;padding:3px 7px;border-radius:2px;border:1px solid;
}
.badge-ex{color:#e85a7a;border-color:rgba(232,90,122,.3);background:rgba(232,90,122,.08);}
.badge-explus{color:#c060e0;border-color:rgba(192,96,224,.3);background:rgba(192,96,224,.08);}
.badge-normal{color:#7aaccc;border-color:rgba(122,172,204,.3);background:rgba(122,172,204,.08);}
.recipe-stats{display:flex;gap:0;border:1px solid var(--border);border-radius:3px;overflow:hidden;}
.recipe-stat{flex:1;padding:8px 10px;text-align:center;border-right:1px solid var(--border);}
.recipe-stat:last-child{border-right:none;}
.stat-lbl{font-size:9px;color:var(--text-dim);letter-spacing:.06em;text-transform:uppercase;}
.stat-val{font-size:15px;font-weight:700;color:var(--text-bright);margin-top:1px;}
.stat-val.warn{color:var(--yellow);}
.stat-val.ok{color:var(--green);}

/* ── 작업계산 결과 테이블 ── */
.result-card{
  background:var(--surface);border:1px solid var(--border);border-radius:4px;
  padding:14px 18px;
}
.result-card-title{
  font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-dim);margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.result-card-title::after{content:'';flex:1;height:1px;background:var(--border);}

.rotation-table{width:100%;border-collapse:collapse;}
.rotation-table th{
  font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-dim);padding:5px 8px;text-align:left;
  border-bottom:1px solid var(--border);
}
.rotation-table th.num{text-align:right;}
.rotation-table td{
  padding:6px 8px;font-size:12px;color:var(--text);
  border-bottom:1px solid rgba(28,45,62,.5);
}
.rotation-table td.num{text-align:right;font-variant-numeric:tabular-nums;}
.rotation-table tr:last-child td{border-bottom:none;}
.rotation-table tr.highlight td{color:var(--text-bright);}
.rotation-table tr.highlight td:first-child{color:var(--accent);}

.skill-chips{display:flex;gap:4px;flex-wrap:wrap;align-items:center;}
.chip{
  font-size:10px;padding:2px 7px;border-radius:2px;border:1px solid var(--border);
  color:var(--text-dim);white-space:nowrap;
}
.chip.work{color:#5ab8d4;border-color:rgba(90,184,212,.3);background:rgba(90,184,212,.06);}
.chip.buff{color:#c8b840;border-color:rgba(200,184,64,.3);background:rgba(200,184,64,.06);}
.chip.state{color:#a06ccc;border-color:rgba(160,108,204,.3);background:rgba(160,108,204,.06);}
.chip.sep{color:var(--border2);background:none;border:none;padding:2px 2px;font-size:12px;}

.work-total-box{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:12px;padding:10px 12px;
  background:rgba(62,207,170,.06);border:1px solid var(--accent-dim);border-radius:3px;
}
.work-total-label{font-size:11px;color:var(--text-dim);}
.work-total-val{font-size:18px;font-weight:700;}
.work-total-val.ok{color:var(--green);}
.work-total-val.warn{color:var(--yellow);}
.work-total-val.bad{color:var(--red);}
.work-remain-info{
  display:flex;gap:12px;margin-top:4px;font-size:11px;color:var(--text-dim);
}
.work-remain-info b{color:var(--text);}

.action-box{
  display:flex;align-items:center;gap:10px;padding:9px 12px;
  background:var(--surface2);border:1px solid var(--border);border-radius:3px;
  margin-top:10px;
}
.action-box .action-icon{font-size:16px;flex-shrink:0;}
.action-box .action-text{font-size:11px;color:var(--text-dim);line-height:1.5;}
.action-box .action-text b{color:var(--text-bright);}
.action-box.ok{border-color:rgba(77,200,144,.3);background:rgba(77,200,144,.04);}
.action-box.ok .action-icon{color:var(--green);}
.action-box.warn{border-color:rgba(200,184,64,.3);background:rgba(200,184,64,.04);}
.action-box.warn .action-icon{color:var(--yellow);}
.action-box.bad{border-color:rgba(224,80,96,.3);background:rgba(224,80,96,.04);}
.action-box.bad .action-icon{color:var(--red);}

/* ── 구분선 ── */
.divider{height:1px;background:var(--border);margin:4px 0;}

/* ── HEADER ── */
.page-header{margin-bottom:28px;}
.page-eyebrow{font-size:9px;letter-spacing:.28em;color:var(--accent-dim);text-transform:uppercase;margin-bottom:6px;}
.page-title{font-size:20px;font-weight:700;color:var(--text-bright);}
.page-title em{color:var(--accent);font-style:normal;}
.page-sub{font-size:12px;color:var(--text-dim);margin-top:3px;}

/* 빈 상태 */
.empty-state{
  padding:40px 20px;text-align:center;
  border:1px solid var(--border);border-radius:4px;
  background:var(--surface);
}
.empty-state .empty-icon{font-size:28px;margin-bottom:10px;opacity:.4;}
.empty-state p{font-size:12px;color:var(--text-dim);}

/* 여러 레시피 variant 선택 */
.variant-selector{
  display:flex;flex-direction:column;gap:4px;margin-bottom:14px;
}
.variant-btn{
  padding:8px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:3px;
  text-align:left;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-size:11px;color:var(--text-dim);
  transition:border-color .15s,color .15s;
  display:flex;align-items:center;justify-content:space-between;
}
.variant-btn.active{border-color:var(--accent-dim);color:var(--text-bright);background:rgba(62,207,170,.06);}
.variant-btn:hover:not(.active){border-color:var(--border2);color:var(--text);}
.variant-meta{font-size:10px;color:var(--text-dim);display:flex;gap:10px;}
.variant-meta span b{color:var(--text);}
</style>
</head>
<body>

<div class="page-header">
  <div class="page-eyebrow">우주개척 · 고난도 제작</div>
  <div class="page-title"><em>작업 계산기</em></div>
  <div class="page-sub">작숙 입력 후 레시피를 선택하면 각 스킬 조합별 작업량을 계산합니다</div>
</div>

<div class="calc-tabs">
  <button class="calc-tab active" onclick="switchTab('work',this)">작업 계산</button>
  <button class="calc-tab" onclick="switchTab('quality',this)">품질 계산</button>
</div>

<!-- 작업 계산 탭 -->
<div class="calc-panel active" id="panel-work">
  <div class="calc-body">

    <!-- 입력 패널 -->
    <div class="input-panel">

      <div>
        <div class="input-section-label">모드</div>
        <div class="mode-toggle">
          <button class="mode-btn active" onclick="switchMode('preset',this,'work')" id="mode-preset">우주개척</button>
          <button class="mode-btn" onclick="switchMode('custom',this,'work')" id="mode-custom">커스텀</button>
        </div>
      </div>

      <!-- 우주개척 모드 -->
      <div id="work-preset-mode">
        <div class="input-section-label">레시피 선택</div>
        <div class="recipe-chain">
          <div class="field">
            <label>지역</label>
            <select id="sel-region" onchange="onRegionChange()">
              <option value="">── 지역 선택 ──</option>
              <option value="oizys">오이지스</option>
              <option value="paenna">파엔나</option>
              <option value="dongyeong">동경의 만</option>
            </select>
          </div>
          <div class="chain-arrow">▼</div>
          <div class="field">
            <label>레시피</label>
            <select id="sel-group" onchange="onGroupChange()" disabled>
              <option value="">── 지역을 먼저 선택 ──</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 커스텀 모드 -->
      <div id="work-custom-mode" style="display:none;">
        <div class="input-section-label">수치 직접 입력</div>
        <div class="custom-box">
          <div class="field">
            <label>작업량 요구치</label>
            <input type="number" id="custom-work" value="9700" oninput="calcCustom()" placeholder="작업량">
          </div>
          <div class="field">
            <label>progressDivider</label>
            <input type="number" id="custom-pd" value="170" oninput="calcCustom()" placeholder="170">
          </div>
          <div class="field">
            <label>progressModifier</label>
            <input type="number" id="custom-pm" value="90" oninput="calcCustom()" placeholder="90">
          </div>
        </div>
      </div>

      <div class="divider"></div>

      <div>
        <div class="input-section-label">캐릭터 스탯</div>
        <div class="field">
          <label>작업 숙련도</label>
          <input type="number" id="crafts-input" value="5811" class="filled" oninput="onStatsChange()">
          <div class="hint">음식·약액 포함 최종 수치</div>
        </div>
      </div>

    </div><!-- /input-panel -->

    <!-- 결과 패널 -->
    <div class="result-panel" id="work-result">
      <div class="empty-state">
        <div class="empty-icon">⚒</div>
        <p>지역과 레시피를 선택하면<br>작업량 계산 결과가 표시됩니다</p>
      </div>
    </div>

  </div>
</div>

<!-- 품질 계산 탭 (플레이스홀더) -->
<div class="calc-panel" id="panel-quality">
  <div class="empty-state" style="margin-top:20px;">
    <div class="empty-icon">✨</div>
    <p>품질 계산 탭은 준비 중입니다</p>
  </div>
</div>

<script>

// ═══════════════════════════════════════════════════════════════
// rlvl별 progressDivider / progressModifier 매핑
// 팀크래프트 확인값: rlvl=690~730: pD=170, pM=90
// rlvl=701: pD=165, pM=85  (저레벨 레시피)
// 실제 게임 DB 기반 근사값
// ═══════════════════════════════════════════════════════════════
function getRlvlParams(rlvl) {
  // 팀크래프트 이미지 확인 파라미터 우선
  // rlvl 범위별 progressDivider/progressModifier
  if (rlvl >= 750) return { pD: 180, pM: 90 };
  if (rlvl >= 740) return { pD: 178, pM: 90 };
  if (rlvl >= 730) return { pD: 175, pM: 90 };
  if (rlvl >= 720) return { pD: 170, pM: 90 }; // 팀크래프트 확인값 (rlvl=690 기준이나 우주개척 범위)
  if (rlvl >= 710) return { pD: 168, pM: 90 };
  if (rlvl >= 700) return { pD: 165, pM: 85 };
  return { pD: 160, pM: 80 };
}

// s0 계산: s0 = floor((crafts * 21/pD + 2) * pM/100)
function calcS0(crafts, rlvl) {
  const { pD, pM } = getRlvlParams(rlvl);
  return Math.floor((crafts * 21 / pD + 2) * pM / 100);
}

// 작업량 = floor(s0 × 효율/100 × 버프배율)
function calcWork(s0, efficiency, buffMult) {
  return Math.floor(s0 * efficiency / 100 * buffMult);
}

// UI 이벤트
// ═══════════════════════════════════════════════════════════════
function switchTab(tab, btn) {
  document.querySelectorAll('.calc-tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.calc-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-' + tab).classList.add('active');
}

function switchMode(mode, btn, panel) {
  currentMode = mode;
  const wrap = btn.closest('.input-panel');
  wrap.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('work-preset-mode').style.display = mode === 'preset' ? '' : 'none';
  document.getElementById('work-custom-mode').style.display = mode === 'custom' ? '' : 'none';
  if (mode === 'custom') calcCustom();
  else renderResult();
}

function onRegionChange() {
  currentRegion = document.getElementById('sel-region').value;
  currentGroup = '';
  selectedVariantIdx = 0;
  buildGroupSelector();
  renderResult();
}

function onGroupChange() {
  currentGroup = document.getElementById('sel-group').value;
  selectedVariantIdx = 0;
  renderResult();
}

function onStatsChange() {
  const el = document.getElementById('crafts-input');
  el.classList.toggle('filled', el.value !== '');
  if (currentMode === 'preset') renderResult();
  else calcCustom();
}

function selectVariant(idx) {
  selectedVariantIdx = idx;
  renderResult();
}

function buildGroupSelector() {
  const sel = document.getElementById('sel-group');
  sel.innerHTML = '';
  if (!currentRegion) {
    sel.innerHTML = '<option value="">── 지역을 먼저 선택 ──</option>';
    sel.disabled = true;
    return;
  }
  sel.disabled = false;
  sel.innerHTML = '<option value="">── 레시피 선택 ──</option>';
  const groups = [...new Set(
    HARD_RECIPES.filter(r => r.region === currentRegion).map(r => r.group)
  )];
  groups.forEach(g => {
    const opt = document.createElement('option');
    opt.value = g;
    opt.textContent = g;
    sel.appendChild(opt);
  });
}

// ═══════════════════════════════════════════════════════════════
// 커스텀 모드 계산
// ═══════════════════════════════════════════════════════════════
function calcCustom() {
  const crafts = parseInt(document.getElementById('crafts-input').value) || 0;
  const workReq = parseInt(document.getElementById('custom-work').value) || 0;
  const pD = parseInt(document.getElementById('custom-pd').value) || 170;
  const pM = parseInt(document.getElementById('custom-pm').value) || 90;

  const s0 = Math.floor((crafts * 21 / pD + 2) * pM / 100);
  const fakeRecipe = { work: workReq, quality: 0, durability: '-', rlvl: '-', group: '커스텀', region: '', tag: '', missionName: '' };

  renderWorkResult(s0, fakeRecipe, '커스텀', 'custom');
}

// ═══════════════════════════════════════════════════════════════
// 프리셋 모드 렌더
// ═══════════════════════════════════════════════════════════════
function renderResult() {
  const resultEl = document.getElementById('work-result');
  if (!currentRegion || !currentGroup) {
    resultEl.innerHTML = `<div class="empty-state"><div class="empty-icon">⚒</div><p>지역과 레시피를 선택하면<br>작업량 계산 결과가 표시됩니다</p></div>`;
    return;
  }

  const variants = HARD_RECIPES.filter(r => r.region === currentRegion && r.group === currentGroup);
  if (!variants.length) return;

  const crafts = parseInt(document.getElementById('crafts-input').value) || 0;

  // variant가 여러 개면 선택 UI
  let variantUI = '';
  if (variants.length > 1) {
    variantUI = `<div class="result-card"><div class="result-card-title">레시피 변형 선택</div>
      <div class="variant-selector">`;
    variants.forEach((v, i) => {
      const s0v = calcS0(crafts, v.rlvl);
      const isActive = i === selectedVariantIdx;
      variantUI += `<button class="variant-btn ${isActive ? 'active' : ''}" onclick="selectVariant(${i})">
        <span><b style="color:var(--text-bright)">${v.tag}</b>
        ${v.missionName ? `<span style="font-size:10px;color:var(--text-dim);margin-left:6px;">${v.missionName}</span>` : ''}</span>
        <span class="variant-meta">
          <span>작업량 <b>${v.work.toLocaleString()}</b></span>
          <span>내구 <b>${v.durability}</b></span>
          <span>rlvl <b>${v.rlvl}</b></span>
        </span>
      </button>`;
    });
    variantUI += `</div></div>`;
  }

  const recipe = variants[Math.min(selectedVariantIdx, variants.length - 1)];
  const s0 = calcS0(crafts, recipe.rlvl);
  renderWorkResult(s0, recipe, variantUI, 'preset');
}

// ═══════════════════════════════════════════════════════════════
// 실제 결과 렌더링
// ═══════════════════════════════════════════════════════════════
function renderWorkResult(s0, recipe, variantUIOrLabel, mode) {
  const resultEl = document.getElementById('work-result');
  const crafts = parseInt(document.getElementById('crafts-input').value) || 0;
  const workReq = recipe.work;

  // 마무리 작업 1회 작업량
  const finishWork = calcWork(s0, FINISH_EFF, 1);

  // 스킬별 1회 작업량 계산
  const skillRows = SKILL_REF.map(sk => {
    const w = calcWork(s0, sk.eff, 1);
    return { ...sk, workAmt: w };
  });

  // 로테이션 조합 계산
  const comboRows = SKILL_COMBOS.map(combo => {
    const totalBuff = combo.workBuff + (combo.stateBuff ? combo.stateBuff : 0);
    const oneTime = calcWork(s0, combo.efficiency, totalBuff);
    // 총 작업량 = 확신 오프너 포함
    // 확신 오프너 총량 = s0 × combo.shinMult
    // 단, 실제로는: 확신 오프너(확신+공경+강행) = s0 * 2.5로 고정
    // 이후 해당 콤보의 작업량도 포함 (같은 공정 내)
    // 시트 기준: "확신 + 스킬 총 작업량" = 확신 오프너(4789) + 스킬 1회
    // 확신 오프너 총량은 s0*2.5로 고정 (확신+공경+강행 기준)
    const shinOpener = Math.floor(s0 * 2.5);
    let total;
    if (combo.hasShin) {
      // 확신 오프너 자체가 이 콤보 → total = shinOpener (이미 포함)
      total = shinOpener;
    } else {
      // 확신 없는 콤보 → s0 * combo.shinMult (공경만이면 1.5배)
      total = Math.floor(s0 * combo.shinMult);
    }
    return { ...combo, oneTime, total, shinOpener };
  });

  // 확신 오프너 후 남은 진행도 (기준: 확신+공경+강행)
  const mainOpener = comboRows[0];
  const remaining = workReq - mainOpener.shinOpener;

  // 내구 기준 가능 강행 횟수 (마무리 제외): floor((durability - 10) / 10) 근사
  const durability = typeof recipe.durability === 'number' ? recipe.durability : 0;
  const kangWork = skillRows[0].workAmt; // 강행 작업 1회
  const maxKang = durability > 0 ? Math.floor((durability - 10) / 10) : 0;
  const neededKang = kangWork > 0 ? Math.ceil(remaining / kangWork) : 0;

  // 배지 결정
  function getBadge(missionName) {
    if (!missionName) return '';
    if (missionName.includes('EX+')) return `<span class="recipe-badge badge-explus">EX+</span>`;
    if (missionName.includes('EX')) return `<span class="recipe-badge badge-ex">EX</span>`;
    return `<span class="recipe-badge badge-normal">일반</span>`;
  }

  // 지역 한국어
  const regionNames = { oizys: '오이지스', paenna: '파엔나', dongyeong: '동경의 만', '': '' };

  // action box
  let actionHtml = '';
  if (remaining <= 0) {
    actionHtml = `<div class="action-box ok"><div class="action-icon">✅</div><div class="action-text">확신 오프너만으로 <b>작업량 충족</b>! 마무리 스킬만 사용하면 됩니다.</div></div>`;
  } else if (neededKang <= maxKang) {
    actionHtml = `<div class="action-box ok"><div class="action-icon">⚡</div><div class="action-text">강행 작업 <b>${neededKang}회</b> 필요 (${kangWork.toLocaleString()} × ${neededKang} = ${(kangWork * neededKang).toLocaleString()}) — 가능한 강행 <b>${maxKang}회</b> 이상 ✔</div></div>`;
  } else {
    actionHtml = `<div class="action-box warn"><div class="action-icon">⚡</div><div class="action-text">강행 작업 <b>${neededKang}회 필요</b> / 가능 <b>${maxKang}회</b> — 다른 작업 스킬 혼용 검토 필요</div></div>`;
  }

  // 남은 진행도 색상
  const remClass = remaining <= 0 ? 'ok' : remaining > workReq * 0.6 ? 'bad' : 'warn';

  const html = `
    ${mode === 'preset' ? (typeof variantUIOrLabel === 'string' ? variantUIOrLabel : '') : ''}

    <!-- 레시피 정보 -->
    <div class="recipe-info-card">
      <div class="recipe-info-header">
        ${getBadge(recipe.missionName)}
        <span class="recipe-name">${recipe.group || '커스텀'}</span>
        ${recipe.region ? `<span style="font-size:11px;color:var(--text-dim)">${regionNames[recipe.region] || ''}</span>` : ''}
      </div>
      <div class="recipe-stats">
        <div class="recipe-stat">
          <div class="stat-lbl">작업량</div>
          <div class="stat-val warn">${workReq.toLocaleString()}</div>
        </div>
        <div class="recipe-stat">
          <div class="stat-lbl">최고품질</div>
          <div class="stat-val">${recipe.quality ? recipe.quality.toLocaleString() : '-'}</div>
        </div>
        <div class="recipe-stat">
          <div class="stat-lbl">내구도</div>
          <div class="stat-val">${recipe.durability}</div>
        </div>
        <div class="recipe-stat">
          <div class="stat-lbl">100효율 (s0)</div>
          <div class="stat-val ok">${s0}</div>
        </div>
      </div>
    </div>

    <!-- 로테이션 조합 결과 -->
    <div class="result-card">
      <div class="result-card-title">작업 로테이션 조합</div>
      <table class="rotation-table">
        <thead>
          <tr>
            <th>스킬 조합</th>
            <th class="num">효율</th>
            <th class="num">작업량</th>
            <th class="num">총 작업량</th>
          </tr>
        </thead>
        <tbody>
          ${comboRows.map(row => `
          <tr class="${row.highlight ? 'highlight' : ''}">
            <td>
              <div class="skill-chips">
                ${row.chips.map(c => `<span class="chip ${c.type}">${c.text}</span>`).join('')}
              </div>
            </td>
            <td class="num">${row.efficiency}</td>
            <td class="num">${row.oneTime.toLocaleString()}</td>
            <td class="num"><b>${row.total.toLocaleString()}</b></td>
          </tr>`).join('')}
        </tbody>
      </table>

      <!-- 오프너 후 남은 진행도 -->
      <div class="work-total-box">
        <div>
          <div class="work-total-label">오프너 후 남은 진행도</div>
          <div class="work-remain-info">
            <span>작업량 <b>${workReq.toLocaleString()}</b></span>
            <span>−</span>
            <span>확신+공경+강행 <b>${mainOpener.shinOpener.toLocaleString()}</b></span>
            <span>=</span>
          </div>
        </div>
        <div class="work-total-val ${remClass}">${remaining.toLocaleString()}</div>
      </div>

      ${actionHtml}
    </div>

    <!-- 스킬별 1회 작업량 참고 -->
    <div class="result-card">
      <div class="result-card-title">스킬별 1회 작업량 (현재 숙련도 기준)</div>
      <table class="rotation-table">
        <thead>
          <tr>
            <th>스킬</th>
            <th class="num">효율</th>
            <th class="num">작업량</th>
            <th class="num">총 작업량</th>
          </tr>
        </thead>
        <tbody>
          ${skillRows.map(row => {
            // 총 작업량 = 확신오프너 + 해당 스킬 1회 (마무리 전 공정만)
            const opener = mainOpener.shinOpener;
            const total = opener + row.workAmt;
            return `<tr>
              <td><span class="chip work">${row.name}</span></td>
              <td class="num">${row.eff}</td>
              <td class="num">${row.workAmt.toLocaleString()}</td>
              <td class="num">${total.toLocaleString()}</td>
            </tr>`;
          }).join('')}
          <tr style="opacity:.6">
            <td><span class="chip" style="color:var(--text-dim)">마무리 '작업'</span></td>
            <td class="num">120</td>
            <td class="num">${finishWork.toLocaleString()}</td>
            <td class="num" style="color:var(--text-dim)">참고용</td>
          </tr>
        </tbody>
      </table>
    </div>
  `;

  resultEl.innerHTML = html;
}

// ═══════════════════════════════════════════════════════════════
// 초기화
// ═══════════════════════════════════════════════════════════════
document.querySelectorAll('input[type="number"]').forEach(el => {
  el.addEventListener('input', function() {
    this.classList.toggle('filled', this.value !== '');
  });
});
</script>
</body>
</html>
